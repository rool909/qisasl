];

let current=null,chapterIndex=0,filter="all";
let favorites=JSON.parse(localStorage.getItem("favStories")||"[]");

function render(){
let list=stories.filter(s=>
(filter==="fav"?favorites.includes(s.id):true)&&
s.title.includes(document.getElementById("search").value)
);
document.getElementById("stories").innerHTML=list.map(s=>`
<div class="card">
<img src="${s.img}" alt="${s.title}">
<h3>${s.title}</h3><p>${s.desc}</p>
<button onclick="openStory(${s.id})">📖 اقرأ</button>
</div>`).join("")||"<p>لا توجد قصص هنا.</p>";
}
function openStory(id){
current=stories.find(s=>s.id===id);chapterIndex=0;
document.getElementById("library").style.display="none";
document.getElementById("reader").style.display="block";
showChapter();window.scrollTo(0,0);
}
function showChapter(){
let c=current.chapters[chapterIndex];
document.getElementById("title").textContent=current.title;
document.getElementById("chapter").textContent=c[0];
document.getElementById("storyText").textContent=c[1];
document.getElementById("picture").src=c[2];
document.getElementById("ending").style.display=chapterIndex===current.chapters.length-1?"block":"none";
document.getElementById("wisdom").textContent=current.wisdom;
document.getElementById("counter").textContent="الفصل "+(chapterIndex+1)+" من "+current.chapters.length;
document.getElementById("fav").textContent=favorites.includes(current.id)?"⭐ إزالة من المفضلة":"⭐ أضف للمفضلة";
}
function next(){
if(chapterIndex<current.chapters.length-1){chapterIndex++;stopSpeech();showChapter();window.scrollTo(0,0);}
else document.getElementById("counter").textContent="🎉 انتهت القصة!";
}
function previous(){
if(chapterIndex>0){chapterIndex--;stopSpeech();showChapter();}
}
function speak(){
stopSpeech();
let text=current.chapters[chapterIndex][1];
let msg=new SpeechSynthesisUtterance(text);
msg.lang="ar-SA";msg.rate=0.9;
speechSynthesis.speak(msg);
}
function pauseSpeech(){if(speechSynthesis.speaking)speechSynthesis.pause();}
function resumeSpeech(){if(speechSynthesis.paused)speechSynthesis.resume();}
function stopSpeech(){speechSynthesis.cancel();}
function toggleFav(){
if(favorites.includes(current.id))favorites=favorites.filter(x=>x!==current.id);
else favorites.push(current.id);
localStorage.setItem("favStories",JSON.stringify(favorites));
showChapter();
}
function home(){
stopSpeech();
document.getElementById("reader").style.display="none";
document.getElementById("library").style.display="block";
filter="all";document.getElementById("search").value="";render();
}
function favoritesPage(){
stopSpeech();filter="fav";
document.getElementById("reader").style.display="none";
document.getElementById("library").style.display="block";
document.getElementById("search").value="";render();
}
render();
</script>
</body>
</html>
